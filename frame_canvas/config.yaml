name: Frame Canvas
version: "1.0.0"
url: https://github.com/sparkensparken/frame-canvas
slug: frame_canvas
description: Turn Art Mode on a Samsung The Frame into a beautiful, living dashboard – clock, weather, calendars, cameras, news and photography
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true
ingress: true
ingress_port: 8765
ingress_entry: control
panel_icon: mdi:image-frame
panel_title: Frame Canvas
options:
  tv_ip: ""
  tv_mac: ""
  only_when_art_mode: true
  auto_ha_speakers: true
  cameras: []
schema:
  tv_ip: str?
  tv_mac: str?
  only_when_art_mode: bool
  auto_ha_speakers: bool
  cameras:
    - name: str
      snapshot_url: str?
      rtsp_url: str?
